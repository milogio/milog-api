log_format milog_safe '$remote_addr $request_method $status $request_time';

server {
    listen 80 default_server;
    server_name api.milog.ca;

    access_log /dev/stdout milog_safe;
    error_log /dev/stderr crit;

    if ($host != api.milog.ca) {
        return 421;
    }

    root /var/www/public;
    index index.php;
    client_max_body_size 1m;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /ready {
        access_log off;
        try_files /index.php =404;
        include /etc/nginx/production-fastcgi-params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/production-fastcgi-params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        access_log off;
        expires 1h;
    }
}
