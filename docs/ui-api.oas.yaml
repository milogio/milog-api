openapi: 3.1.0
info:
  title: MiLog UI Authentication API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: First-party, tenant-bound authentication contract for milog-ui.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      summary: Authenticate a user in a tenant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '409':
          description: Valid credentials require an explicit tenant selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSelectionError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token pair rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, revoked, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/me:
    get:
      operationId: currentSession
      summary: Read the current user and token-bound tenant
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                type: object
                required: [user, expires_at]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current access/refresh token family
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke all UI sessions for the current user
      responses:
        '204':
          description: All UI sessions revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        tenant_id:
          type: string
          format: uuid
          description: Optional only when the user has exactly one active membership.
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, name, email, tenant]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        tenant:
          $ref: '#/components/schemas/Tenant'
    Tenant:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    TenantSelectionError:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              required: [tenants]
              properties:
                tenants:
                  type: array
                  items:
                    type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
  responses:
    InvalidCredentials:
      description: Credentials or requested tenant membership are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Missing, invalid, expired, revoked, or inactive tenant session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
    RateLimited:
      description: Too many requests
security:
  - bearerAuth: []
