openapi: 3.1.0
info:
  title: MiLog Public API
  version: 1.0.0
  summary: Public API for ingesting and reading tenant-scoped timeline events.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    This document describes the implemented public MiLog API surface under `/api/v1`.

    The API middleware limits requests to 60 per minute. Responses include
    `X-RateLimit-Limit` and `X-RateLimit-Remaining`; a `429` response also
    includes `Retry-After` (seconds) and `X-RateLimit-Reset` (Unix time).
    Tenant-bound UI authentication is documented separately in `ui-api.oas.yaml`.
servers:
  - url: http://localhost:8980
    description: Local Docker development server
tags:
  - name: Events
    description: Append-only event ingestion
  - name: Timeline
    description: Tenant-scoped timeline reads
security:
  - ApiKeyAuth: []
paths:
  /api/v1/events:
    post:
      tags:
        - Events
      summary: Store a timeline event
      description: |
        Creates a new append-only event for the tenant resolved from the `X-API-Key`
        request header.
      operationId: createTimelineEvent
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimelineEventRequest'
            examples:
              basic:
                summary: Basic event payload
                value:
                  actor_type: user
                  actor_id: "42"
                  action: created
                  target_type: invoice
                  target_id: inv_1
                  log_level: error
                  metadata:
                    source: billing
                  occurred_at: "2026-05-01T22:00:00Z"
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          description: |
            A tenant-scoped key for safe retries. Repeating the same validated
            payload returns the original event with status `200` and
            `Idempotency-Replayed: true`; using the key with a different payload
            returns `409`. Without a key, repeated requests can create multiple events.
          schema:
            type: string
            maxLength: 255
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
              examples:
                created:
                  value:
                    id: 019de5b9-705b-72dc-89cf-35a134013e89
                    tenant_id: 019de5b9-6f00-7cec-b7ca-fbcc18d61234
                    actor_type: user
                    actor_id: "42"
                    action: created
                    target_type: invoice
                    target_id: inv_1
                    log_level: error
                    metadata:
                      source: billing
                    occurred_at: "2026-05-01T22:00:00Z"
                    created_at: "2026-05-01T22:00:00Z"
                    message: user 42 created invoice inv_1
        '200':
          description: An identical idempotent request was replayed. The body is the original event.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEvent'
        '409':
          description: The idempotency key was previously used with a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              example:
                message: The idempotency key was already used with a different request.
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              examples:
                invalidApiKey:
                  value:
                    message: Invalid API key.
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                missingFields:
                  value:
                    message: The actor type field is required. (and 4 more errors)
                    errors:
                      actor_type:
                        - The actor type field is required.
                      actor_id:
                        - The actor id field is required.
                      action:
                        - The action field is required.
                      target_type:
                        - The target type field is required.
                      target_id:
                        - The target id field is required.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/timeline:
    get:
      tags:
        - Timeline
      summary: List timeline events
      description: |
        Returns paginated timeline events for the tenant resolved from the
        `X-API-Key` header or a tenant-bound MiLog UI bearer token. Results are
        ordered by `occurred_at` descending, then `created_at` descending, then
        `id` descending. Event ingestion continues to accept raw canonical log
        levels (`trace`, `debug`, `info`, `warn`, `error`, and `fatal`), while
        this timeline filter accepts viewer-facing normalized levels.
      operationId: listTimelineEvents
      security:
        - ApiKeyAuth: []
        - UiBearerAuth: []
      parameters:
        - name: target_id
          in: query
          required: false
          description: Filter events by target identifier.
          schema:
            type: string
            maxLength: 255
        - name: actor_id
          in: query
          required: false
          description: Filter events by actor identifier.
          schema:
            type: string
            maxLength: 255
        - name: type
          in: query
          required: false
          description: Filter events where `actor_type` or `target_type` matches this value.
          schema:
            type: string
            maxLength: 255
        - name: log_level
          in: query
          required: false
          description: |
            Comma-separated viewer-facing levels. Whitespace is trimmed and
            repeated values are deduplicated. Allowed values are `debug`,
            `info`, `success`, `warning`, and `error`, with at most five
            distinct values. An unknown value or empty list item returns `422`.

            Selected levels have OR semantics. This filter has AND semantics
            with `target_id`, `actor_id`, and `type`. Mappings are: `debug`
            matches `trace` and `debug`; `info` matches `info`, `NULL`, and
            unrecognized legacy stored values; `success` matches legacy
            `success`; `warning` matches `warn` and legacy `warning`; and
            `error` matches `error` and `fatal`. Pagination links retain the
            complete supplied parameter.
          schema:
            type: string
            example: warning,error
          examples:
            errors:
              summary: Warning and error display levels
              value: warning,error
        - name: page
          in: query
          required: false
          description: Page number for offset pagination; omit when using a cursor.
          schema:
            type: integer
            minimum: 1
        - name: pagination
          in: query
          required: false
          description: Use `cursor` for stable cursor pagination. Defaults to `offset` for backward compatibility.
          schema:
            type: string
            enum:
              - offset
              - cursor
            default: offset
        - name: cursor
          in: query
          required: false
          description: |
            Opaque cursor from `meta.next_cursor` or `meta.prev_cursor` in a
            cursor-paginated response. Supplying it also selects cursor pagination.
          schema:
            type: string
      responses:
        '200':
          description: |
            Paginated timeline events. The default offset response includes
            page numbers and totals; the cursor response includes opaque cursors
            and has no page number or total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEventCollection'
              examples:
                offset:
                  value:
                    data:
                      - id: 019de5b9-705b-72dc-89cf-35a134013e89
                        tenant_id: 019de5b9-6f00-7cec-b7ca-fbcc18d61234
                        actor_type: system
                        actor_id: actor-2
                        action: created
                        target_type: user
                        target_id: target-1
                        log_level: info
                        metadata: []
                        occurred_at: "2026-05-01T22:01:00Z"
                        created_at: "2026-05-01T22:01:00Z"
                        message: system actor-2 created user target-1
                      - id: 019de5b9-704f-7b40-8445-5f4ce93f0123
                        tenant_id: 019de5b9-6f00-7cec-b7ca-fbcc18d61234
                        actor_type: user
                        actor_id: actor-1
                        action: updated
                        target_type: invoice
                        target_id: target-1
                        log_level: warn
                        metadata:
                          type: billing
                        occurred_at: "2026-05-01T22:00:00Z"
                        created_at: "2026-05-01T22:00:00Z"
                        message: user actor-1 updated invoice target-1
                    links:
                      first: http://localhost:8980/api/v1/timeline?page=1
                      last: http://localhost:8980/api/v1/timeline?page=1
                      prev: null
                      next: null
                    meta:
                      current_page: 1
                      from: 1
                      last_page: 1
                      links:
                        - url: null
                          label: "&laquo; Previous"
                          active: false
                        - url: http://localhost:8980/api/v1/timeline?page=1
                          label: "1"
                          active: true
                        - url: null
                          label: "Next &raquo;"
                          active: false
                      path: http://localhost:8980/api/v1/timeline
                      per_page: 50
                      to: 2
                      total: 2
                cursor:
                  summary: First cursor page captured from the feature environment with a one-event page size
                  value:
                    data:
                      - id: 01a120fc-eb8a-722d-9a1c-44a8f3dac6fc
                        tenant_id: 01a120fc-eb84-7136-838e-ff26f1533d7c
                        actor_type: user
                        actor_id: "1"
                        action: created
                        target_type: invoice
                        target_id: invoice-1
                        log_level: info
                        metadata: []
                        occurred_at: "2026-10-09T14:05:48.000000Z"
                        created_at: "2026-10-09T14:06:49.000000Z"
                        message: user 1 created invoice invoice-1
                    links:
                      first: null
                      last: null
                      prev: null
                      next: http://localhost:8980/api/v1/timeline?pagination=cursor&cursor=eyJvY2N1cnJlZF9hdCI6IjIwMjYtMTAtMDkgMTQ6MDU6NDgiLCJjcmVhdGVkX2F0IjoiMjAyNi0xMC0wOSAxNDowNjo0OSIsImlkIjoiMDFhMTIwZmMtZWI4YS03MjJkLTlhMWMtNDRhOGYzZGFjNmZjIiwiX3BvaW50c1RvTmV4dEl0ZW1zIjp0cnVlfQ
                    meta:
                      path: http://localhost:8980/api/v1/timeline
                      per_page: 1
                      next_cursor: eyJvY2N1cnJlZF9hdCI6IjIwMjYtMTAtMDkgMTQ6MDU6NDgiLCJjcmVhdGVkX2F0IjoiMjAyNi0xMC0wOSAxNDowNjo0OSIsImlkIjoiMDFhMTIwZmMtZWI4YS03MjJkLTlhMWMtNDRhOGYzZGFjNmZjIiwiX3BvaW50c1RvTmV4dEl0ZW1zIjp0cnVlfQ
                      prev_cursor: null
        '401':
          description: Missing or invalid API key or UI bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              examples:
                invalidApiKey:
                  value:
                    message: Invalid API key.
        '422':
          description: Query validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidPage:
                  value:
                    message: The page must be at least 1.
                    errors:
                      page:
                        - The page must be at least 1.
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  responses:
    TooManyRequests:
      description: The API-wide request limit was exceeded.
      headers:
        X-RateLimit-Limit:
          description: Maximum requests allowed in the current window.
          schema:
            type: integer
            example: 60
        X-RateLimit-Remaining:
          description: Requests remaining in the current window.
          schema:
            type: integer
            example: 0
        Retry-After:
          description: Seconds until the request can be retried.
          schema:
            type: integer
            example: 60
        X-RateLimit-Reset:
          description: Unix timestamp in seconds when the current window resets.
          schema:
            type: integer
            example: 1791554833
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          example:
            message: Too Many Attempts.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Tenant-scoped API key required for all public MiLog API requests.
    UiBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tenant-bound access token issued by `/api/v1/auth/login`.
  schemas:
    CreateTimelineEventRequest:
      type: object
      additionalProperties: false
      required:
        - actor_type
        - actor_id
        - action
        - target_type
        - target_id
      properties:
        actor_type:
          type: string
          maxLength: 255
        actor_id:
          type: string
          maxLength: 255
        action:
          type: string
          maxLength: 255
        target_type:
          type: string
          maxLength: 255
        target_id:
          type: string
          maxLength: 255
        log_level:
          type: string
          enum:
            - trace
            - debug
            - info
            - warn
            - error
            - fatal
          default: info
        metadata:
          description: JSON object or list. An omitted or empty value is returned as an empty list.
          default: []
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        occurred_at:
          type:
            - string
            - "null"
          format: date-time
    TimelineEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - actor_type
        - actor_id
        - action
        - target_type
        - target_id
        - log_level
        - metadata
        - occurred_at
        - created_at
        - message
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        actor_type:
          type: string
        actor_id:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        log_level:
          type:
            - string
            - "null"
          description: Stored level. Legacy events may contain other values, including `success` and `warning`.
        metadata:
          description: JSON object or list. Omitted or empty metadata currently appears as `[]`.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        occurred_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type:
            - string
            - "null"
          format: date-time
        message:
          type: string
    TimelineEventCollection:
      description: Offset and cursor pagination have different metadata shapes.
      oneOf:
        - $ref: '#/components/schemas/OffsetTimelineEventCollection'
        - $ref: '#/components/schemas/CursorTimelineEventCollection'
    OffsetTimelineEventCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/OffsetPaginationMeta'
    CursorTimelineEventCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'
        links:
          $ref: '#/components/schemas/CursorPaginationLinks'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    PaginationLinks:
      type: object
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type:
            - string
            - "null"
          format: uri
        last:
          type:
            - string
            - "null"
          format: uri
        prev:
          type:
            - string
            - "null"
          format: uri
        next:
          type:
            - string
            - "null"
          format: uri
    CursorPaginationLinks:
      type: object
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          type: "null"
        last:
          type: "null"
        prev:
          type:
            - string
            - "null"
          format: uri
        next:
          type:
            - string
            - "null"
          format: uri
    OffsetPaginationMeta:
      type: object
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          type: integer
        from:
          type:
            - integer
            - "null"
        last_page:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginationMetaLink'
        path:
          type: string
          format: uri
        per_page:
          type: integer
        to:
          type:
            - integer
            - "null"
        total:
          type: integer
    CursorPaginationMeta:
      type: object
      required:
        - path
        - per_page
        - next_cursor
        - prev_cursor
      properties:
        path:
          type: string
          format: uri
        per_page:
          type: integer
        next_cursor:
          type:
            - string
            - "null"
          description: Opaque token for the next page, or null at the end.
        prev_cursor:
          type:
            - string
            - "null"
          description: Opaque token for the previous page, or null at the start.
    PaginationMetaLink:
      type: object
      required:
        - url
        - label
        - active
      properties:
        url:
          type:
            - string
            - "null"
          format: uri
        label:
          type: string
        active:
          type: boolean
    UnauthorizedError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Invalid API key.
    RateLimitError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Too Many Attempts.
    ConflictError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: The idempotency key was already used with a different request.
    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          description: Laravel summarizes the first validation error; the exact text depends on failed fields.
          example: The actor type field is required. (and 4 more errors)
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
